<!DOCTYPE html>
<html>
<head>
    <title>Placement Drives</title>
</head>

<body>

<h1>Add Placement Drive</h1>

<form method="POST">

Company ID:
<br>
<input type="number" name="company_id" required>
<br><br>

Drive Date:
<br>
<input type="date" name="drive_date" required>
<br><br>

Job Role:
<br>
<input type="text" name="job_role" required>
<br><br>

Package (LPA):
<br>
<input type="number" step="0.01" name="package" required>
<br><br>

Eligibility CGPA:
<br>
<input type="number" step="0.01" name="eligibility_cgpa" required>
<br><br>

Location:
<br>
<input type="text" name="location" required>
<br><br>

<button type="submit">
Add Drive
</button>

</form>

<br>

<a href="/dashboard">
Back to Dashboard
</a>

</body>
</html>
