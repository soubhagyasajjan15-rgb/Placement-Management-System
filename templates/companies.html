<!DOCTYPE html>
<html>
<head>
    <title>Company Management</title>
</head>
<body>

<h1>Company Management</h1>

<form method="POST">

<label>Company Name</label><br>
<input type="text" name="company_name" required><br><br>

<label>Job Role</label><br>
<input type="text" name="job_role" required><br><br>

<label>Package (LPA)</label><br>
<input type="number" step="0.01" name="package" required><br><br>

<label>Minimum CGPA</label><br>
<input type="number" step="0.01" name="eligibility_cgpa" required><br><br>

<label>Location</label><br>
<input type="text" name="location" required><br><br>

<button type="submit">Add Company</button>

</form>

<br>

<a href="/dashboard">Back to Dashboard</a>

</body>
</html>
