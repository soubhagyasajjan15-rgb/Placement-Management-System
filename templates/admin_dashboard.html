<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
        }

        h1{
            margin-top:20px;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            margin-top:30px;
        }

        .card{
            width:220px;
            padding:20px;
            background:white;
            border-radius:10px;
            box-shadow:0 2px 8px gray;
        }

        .card h2{
            color:#007BFF;
        }

        .card p{
            font-size:30px;
            font-weight:bold;
        }

        .menu{
            margin-top:40px;
        }

        .menu a{
            text-decoration:none;
            padding:10px 20px;
            background:#007BFF;
            color:white;
            border-radius:5px;
            margin:5px;
            display:inline-block;
        }

        .menu a:hover{
            background:#0056b3;
        }
    </style>

</head>

<body>

<h1>Placement Management System</h1>

<h2>Student Applications</h2>

<table border="1">

<tr>
<th>USN</th>
<th>Name</th>
<th>Company</th>
<th>Role</th>
<th>Status</th>
<th>Resume</th>
</tr>


{% for a in applications %}

<tr>

<td>{{a.usn}}</td>

<td>{{a.name}}</td>

<td>{{a.company_name}}</td>

<td>{{a.job_role}}</td>

<td>{{a.status}}</td>

<td>
<a href="/uploads/{{a.resume}}" target="_blank">
    <a href="/admin_applications">
    <button>Manage Applications</button>
</a>
View Resume
</a>
</td>

</tr>

{% endfor %}

</table>
