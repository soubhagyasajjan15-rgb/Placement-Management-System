<!DOCTYPE html>
<html>
<head>
    <title>Apply for Placement Drive</title>
</head>
<body>

<h2>Apply for Placement Drive</h2>

<form method="POST">

    <label>Student USN:</label><br>
    <input type="text" name="usn" required><br><br>

    <label>Select Drive:</label><br>
    <select name="drive_id" required>
        {% for drive in drives %}
        <option value="{{ drive[0] }}">
            {{ drive[0] }} - {{ drive[1] }} ({{ drive[2] }})
        </option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">Apply</button>

</form>

</body>
</html>
