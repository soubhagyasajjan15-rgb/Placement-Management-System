<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
</head>

<body>

<h2>Student Profile</h2>

<table border="1" cellpadding="10">

<tr>
    <th>USN</th>
    <td>{{ student.usn }}</td>
</tr>

<tr>
    <th>Name</th>
    <td>{{ student.name }}</td>
</tr>

<tr>
    <th>Department</th>
    <td>{{ student.department }}</td>
</tr>

<tr>
    <th>CGPA</th>
    <td>{{ student.cgpa }}</td>
</tr>

<tr>
    <th>Email</th>
    <td>{{ student.email }}</td>
</tr>

<tr>
    <th>Phone</th>
    <td>{{ student.phone }}</td>
</tr>

<tr>
    <th>Resume</th>
    <td>
        {% if student.resume %}
            <a href="{{ url_for('uploaded_file', filename=student.resume) }}" target="_blank">
                View Resume
            </a>
        {% else %}
            No Resume Uploaded
        {% endif %}
    </td>
</tr>

</table>

<br>

<a href="/student_dashboard">Back to Dashboard</a>

</body>
</html>
