<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>

    <style>

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        th{
            background-color:lightblue;
        }

        a{
            text-decoration:none;
            color:red;
            font-weight:bold;
        }

    </style>

</head>

<body>

<h1>Student List</h1>

<table>

<tr>
<th>Edit</th>
<th>Delete</th>
<th>Resume</th>

</tr>

{% for student in students %}

<tr>

<td>{{ student[0] }}</td>
<td>{{ student[1] }}</td>
<td>{{ student[2] }}</td>
<td>{{ student[3] }}</td>
<td>{{ student[4] }}</td>
<td>{{ student[5] }}</td>

<td>
<a href="/edit_student/{{ student[0] }}">Edit</a>
</td>

<td>
<a href="/delete_student/{{ student[0] }}">Delete</a>
</td>

<td>
{% if student[6] %}
    <a href="/uploads/{{ student[6] }}" target="_blank">View Resume</a>
{% else %}
    Not Uploaded
{% endif %}
</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/dashboard">Back to Dashboard</a>

</body>
</html>
