<!DOCTYPE html>
<html>
<head>
<title>My Applications</title>
</head>

<body>

<h2>My Applications</h2>

{% if applications %}

<table border="1">

<tr>
<th>Company</th>
<th>Role</th>
<th>Location</th>
<th>Status</th>
</tr>

{% for app in applications %}

<tr>
<td>{{ app[0] }}</td>
<td>{{ app[1] }}</td>
<td>{{ app[2] }}</td>
<td>{{ app[3] }}</td>
</tr>

{% endfor %}

</table>

{% else %}

<p>No applications found.</p>

{% endif %}

</body>
</html>
